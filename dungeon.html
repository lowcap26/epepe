<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>THE PIT: DUNGEON — $EPEPE</title>
<link rel="icon" href="pepe.png"/>
<meta name="theme-color" content="#070504"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://evilpepe.lol/dungeon.html"/>
<meta property="og:title" content="THE PIT: DUNGEON — $EPEPE"/>
<meta property="og:description" content="Collect supply. Jeets chase harder the more you hold. Walk the altar to ash it. Game score — not the token burn."/>
<meta property="og:image" content="https://evilpepe.lol/card.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:site" content="@evilpepelol"/>
<meta name="twitter:title" content="THE PIT: DUNGEON — $EPEPE"/>
<meta name="twitter:description" content="Collect supply. Walk the altar. Game score — not the token burn."/>
<meta name="twitter:image" content="https://evilpepe.lol/card.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet"/>
<style>
  :root { --bg:#070504; --fg:#f3ece4; --muted:#9a8b7c; --fire:#ff5a00; --ember:#e8a04a; --acid:#5cbf6a; --blood:#c43a2a; --border:#3a2a20; --surface:#110c09; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Comic Neue", system-ui, sans-serif; overflow:hidden; }
  .wrap { display:flex; flex-direction:column; height:100dvh; min-height:100dvh; }
  header, footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; border-color:var(--border); font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
  header { border-bottom:1px solid var(--border); }
  footer { border-top:1px solid var(--border); color:var(--muted); justify-content:center; text-align:center; }
  header a { color:var(--muted); text-decoration:none; }
  header a:hover { color:var(--fg); }
  .hud { display:flex; gap:12px; color:var(--muted); }
  .hud b { color:var(--fg); font-weight:700; }
  .hud .ash b { color:var(--ember); }
  .hud .sup b { color:var(--acid); }
  .stage { position:relative; flex:1; min-height:0; background:#070504; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(7,5,4,.82); padding:24px; text-align:center; }
  .overlay[hidden] { display:none; }
  .card { max-width:360px; }
  .kicker { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--fire); margin:0; }
  h1 { font-family:Bangers, Impact, sans-serif; font-size:42px; letter-spacing:.02em; margin:8px 0 0; font-weight:400; }
  .blurb { color:var(--muted); font-size:15px; line-height:1.45; margin:12px 0 0; }
  .mod { margin:14px 0 0; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ember); }
  .seed { margin:4px 0 0; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  button.start { margin-top:18px; width:100%; min-height:44px; border:1px solid var(--fire); background:var(--fire); color:#1a0a00; font-family:inherit; font-weight:700; letter-spacing:.18em; text-transform:uppercase; font-size:14px; cursor:pointer; }
  .keys { margin:12px 0 0; font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
  .pads { pointer-events:none; position:absolute; inset:auto 12px 12px; display:none; align-items:flex-end; justify-content:space-between; }
  .pads.on { display:flex; }
  .stick { pointer-events:auto; width:120px; height:120px; border-radius:50%; border:1px solid var(--border); background:rgba(17,12,9,.8); position:relative; }
  .knob { position:absolute; width:44px; height:44px; border-radius:50%; background:var(--fire); left:50%; top:50%; transform:translate(-50%,-50%); opacity:.85; }
  .acts { pointer-events:auto; display:flex; gap:12px; }
  .acts button { width:64px; height:64px; border-radius:50%; border:1px solid var(--border); font:700 10px/1 "Comic Neue", sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--fg); cursor:pointer; }
  .acts .poke { background:var(--blood); }
  .acts .fire { background:var(--fire); color:#1a0a00; border-color:var(--fire); }
  @media (max-width:800px) { .pads.on { display:flex; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>THE PIT: <span style="color:var(--fire)">DUNGEON</span></div>
    <div class="hud">
      <span>HP <b id="hp">3</b></span>
      <span>KEY <b id="keyn">0</b></span>
      <span class="sup">SUPPLY <b id="held">0</b></span>
      <span class="ash">ASH <b id="ash">0</b></span>
      <span>A TRIDENT</span>
      <span id="slotb">B —</span>
    </div>
    <a href="./pit.html">3D</a>
  </header>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <p class="kicker">the pit</p>
        <h1 id="title">DUNGEON I</h1>
        <p class="blurb" id="blurb">Trident is yours. Find the Pit Key, the Map, and Hellfire. Put down the Jeet King. Walk 0369 to ash the bag.</p>
        <p class="mod" id="mod"></p>
        <p class="seed" id="seed"></p>
        <button class="start" id="start" type="button">Start run</button>
        <p class="keys">WASD move · J / Space trident · K fireball</p>
      </div>
    </div>
    <div class="pads" id="pads">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      <div class="acts">
        <button class="poke" id="poke" type="button">Poke</button>
        <button class="fire" id="fire" type="button">Fire</button>
      </div>
    </div>
  </div>
  <footer>Game score. Not the $EPEPE token burn. @evilpepelol</footer>
</div>
<script>
(function () {
  const TILE = 48, COLS = 13, ROWS = 11, WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE, STEP = 1 / 60;
  const STEP_PX = 3;
  const ASH_KEY = "epepe_dungeon_ash_v1";
  const MOVE = new Set(["KeyW","KeyA","KeyS","KeyD","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","KeyJ","KeyK","KeyF","Enter"]);
  const MODS = [
    { id: "heat", label: "Jeets smell the bag. They run hotter." },
    { id: "greedy", label: "Chests pay double. Heat starts higher." },
    { id: "thin", label: "One heart. Supply is worth 2×." },
    { id: "magnet", label: "Bags slide toward you." },
    { id: "calm", label: "Jeets are slow. You burn less per hit." },
  ];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const pads = document.getElementById("pads");
  const stickEl = document.getElementById("stick");
  const knob = document.getElementById("knob");
  function loadImg(src) {
    const img = new Image();
    img.src = src;
    return img;
  }
  const sheets = {
    idle: loadImg("game/player-idle.png?v=15"),
    walk: loadImg("game/player-walk.png?v=15"),
    attack: loadImg("game/player-attack.png?v=15"),
    shoot: loadImg("game/player-shoot.png?v=15"),
    jeetB: loadImg("game/jeet-blue.png?v=4"),
    jeetS: loadImg("game/jeet-suit.png?v=4"),
    fire: loadImg("game/fireball.png?v=4"),
    coin: loadImg("game/coin.png?v=4"),
    chest: loadImg("game/chest.png?v=4"),
    altar: loadImg("game/altar.png?v=4"),
    floor: loadImg("game/floor.png"),
    wall: loadImg("game/wall.png"),
    key: loadImg("game/item-key.png"),
    heart: loadImg("game/item-heart.png"),
    hellfire: loadImg("game/item-hellfire.png"),
    map: loadImg("game/item-map.png"),
  };

  function todaySeed() {
    const d = new Date();
    return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  }
  function mulberry(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function emptyMap() {
    const m = [];
    for (let y = 0; y < ROWS; y++) {
      m[y] = [];
      for (let x = 0; x < COLS; x++) m[y][x] = (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1) ? 1 : 0;
    }
    return m;
  }
  function carveDoor(m, side) {
    const mx = Math.floor(COLS / 2), my = Math.floor(ROWS / 2);
    if (side === "left") { m[my][0] = 3; m[my - 1][0] = 3; }
    if (side === "right") { m[my][COLS - 1] = 3; m[my - 1][COLS - 1] = 3; }
    if (side === "up") { m[0][mx] = 3; m[0][mx - 1] = 3; }
    if (side === "down") { m[ROWS - 1][mx] = 3; m[ROWS - 1][mx - 1] = 3; }
  }
  function carveLocked(m, side) {
    carveDoor(m, side);
    const mx = Math.floor(COLS / 2), my = Math.floor(ROWS / 2);
    if (side === "left") { m[my][0] = 4; m[my - 1][0] = 4; }
    if (side === "right") { m[my][COLS - 1] = 4; m[my - 1][COLS - 1] = 4; }
  }
  function addCells(m, cells, t) {
    cells.forEach(([y, x]) => { if (y > 0 && y < ROWS - 1 && x > 0 && x < COLS - 1) m[y][x] = t; });
  }
  function foe(kind, tx, ty) {
    const boss = kind === "boss";
    const hp = boss ? 8 : kind === "suit" ? 3 : 2;
    return { x: tx * TILE + (boss ? 4 : 8), y: ty * TILE + (boss ? 2 : 6), w: boss ? 52 : 34, h: boss ? 56 : 38, vx: 0, vy: 0, facing: "down", hp, maxHp: hp, kind, hurt: 0 };
  }
  function loot(kind, tx, ty, v) {
    return { x: tx * TILE + 10, y: ty * TILE + 10, v: v || 0, kind };
  }
  function buildDungeon() {
    const enter = emptyMap(), hall = emptyMap(), hub = emptyMap(), keyR = emptyMap();
    const mapR = emptyMap(), gate = emptyMap(), boss = emptyMap(), sanctum = emptyMap();
    carveDoor(enter, "up");
    carveDoor(hall, "down"); carveDoor(hall, "up");
    carveDoor(hub, "down"); carveDoor(hub, "up"); carveDoor(hub, "left"); carveLocked(hub, "right");
    carveDoor(keyR, "right");
    carveDoor(mapR, "down");
    carveLocked(gate, "left"); carveDoor(gate, "right");
    carveDoor(boss, "left"); carveDoor(boss, "up");
    carveDoor(sanctum, "down");
    addCells(hall, [[3,3],[3,9],[7,3],[7,9]], 2);
    addCells(hub, [[3,3],[3,9],[7,3],[7,9]], 1);
    addCells(keyR, [[4,4],[6,4]], 2);
    addCells(gate, [[2,6],[8,6],[4,3],[6,9]], 1);
    addCells(boss, [[2,2],[2,10],[8,2],[8,10]], 2);
    return {
      enter: { id: "enter", name: "Mouth of the Pit", gx: 1, gy: 0, map: enter, coins: [loot("coin",4,4,40), loot("coin",8,6,40), loot("chest",10,3,80)], jeets: [foe("blue",9,7)], links: { up: "hall" } },
      hall: { id: "hall", name: "Jeet Hall", gx: 1, gy: 1, map: hall, coins: [loot("coin",6,5,60)], jeets: [foe("blue",3,4), foe("suit",9,6)], links: { down: "enter", up: "hub" } },
      hub: { id: "hub", name: "Cross of Horns", gx: 1, gy: 2, map: hub, coins: [loot("coin",6,5,50)], jeets: [foe("blue",6,3)], links: { down: "hall", up: "maps", left: "keys", right: "gate" }, locked: { right: true } },
      keys: { id: "keys", name: "Key Chamber", gx: 0, gy: 2, map: keyR, coins: [loot("key",4,5), loot("coin",8,3,70)], jeets: [foe("suit",7,7), foe("blue",3,3)], links: { right: "hub" } },
      maps: { id: "maps", name: "Cartographer's Niche", gx: 1, gy: 3, map: mapR, coins: [loot("map",4,4), loot("hellfire",8,4), loot("heart",6,7)], jeets: [foe("blue",10,6)], links: { down: "hub" } },
      gate: { id: "gate", name: "Sealed Walk", gx: 2, gy: 2, map: gate, coins: [loot("coin",6,8,90)], jeets: [foe("suit",6,4)], links: { left: "hub", right: "boss" }, locked: { left: true } },
      boss: { id: "boss", name: "Throne of the Jeet King", gx: 3, gy: 2, map: boss, coins: [], jeets: [foe("boss",6,4)], links: { left: "gate", up: "sanctum" } },
      sanctum: { id: "sanctum", name: "Altar 0369", gx: 3, gy: 3, map: sanctum, coins: [loot("heart",3,5), loot("chest",9,5,200)], jeets: [], altar: true, links: { down: "boss" } },
    };
  }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  let phase = "ready";
  let rooms = buildDungeon();
  let roomId = "enter";
  let room = rooms[roomId];
  const visited = new Set(["enter"]);
  const player = { x: 6 * TILE, y: 8 * TILE, w: 28, h: 34, vx: 0, vy: 0, facing: "up", hurt: 0 };
  let shots = [], sparks = [];
  let held = 0, lives = 3, ash = 0, lastBurn = 0;
  let invuln = 0, pokeT = 0, shootT = 0, shake = 0, hitstop = 0, frame = 0;
  let invKeys = 0, invFire = false, invMap = false;
  let toastMsg = "", toastT = 0;
  let magnet = false, heatMul = 1, valueMul = 1, modId = "heat";
  const keys = new Set();
  const stick = { x: 0, y: 0 };
  let lastCardinal = "up";
  let walkAcc = 0, lastFacing = "up", dustCool = 0;
  let aimX = 0, aimY = -1;
  let last = performance.now(), acc = 0, raf = 0, running = true;
  let pointerId = null;

  try { ash = Number(localStorage.getItem(ASH_KEY) || 0); } catch (e) {}

  function note(msg) { toastMsg = msg; toastT = 120; }

  function hud() {
    document.getElementById("hp").textContent = lives;
    document.getElementById("held").textContent = held;
    document.getElementById("ash").textContent = ash;
    document.getElementById("keyn").textContent = invKeys;
    document.getElementById("slotb").textContent = invFire ? "B HELLFIRE" : "B —";
    document.getElementById("slotb").style.color = invFire ? "var(--fire)" : "var(--muted)";
  }
  hud();
  document.getElementById("mod").textContent = "Find the Pit Key. Open the east gate. Ash the bag at 0369.";
  document.getElementById("seed").textContent = "";

  function resetRun() {
    rooms = buildDungeon();
    roomId = "enter";
    room = rooms[roomId];
    visited.clear(); visited.add("enter");
    player.x = 6 * TILE; player.y = 8 * TILE; player.hurt = 0; player.facing = "up";
    lastCardinal = "up"; lastFacing = "up"; walkAcc = 0;
    shots = []; sparks = []; held = 0; lives = 3; invuln = pokeT = shootT = 0;
    invKeys = 0; invFire = false; invMap = false;
    magnet = false; heatMul = 1; valueMul = 1;
    note("The Pit opens. North.");
    hud();
  }
  function showOverlay() {
    const title = document.getElementById("title");
    const blurb = document.getElementById("blurb");
    const start = document.getElementById("start");
    overlay.hidden = false;
    pads.classList.remove("on");
    if (phase === "ready") {
      title.textContent = "DUNGEON I";
      blurb.textContent = "Trident is yours. Find the Pit Key, the Map, and Hellfire. Put down the Jeet King. Walk 0369 to ash the bag.";
      start.textContent = "Start run";
    } else if (phase === "dead") {
      title.textContent = "THE PIT TOOK YOU";
      blurb.textContent = "Hearts empty. The rooms reset. Keys and orbs wait again.";
      start.textContent = "Again";
    } else if (phase === "burned") {
      title.textContent = "ASHED " + lastBurn;
      blurb.textContent = "The altar took the run. Ash banks. The dungeon does not.";
      start.textContent = "Again";
    }
  }
  function startPlay() {
    if (phase === "play") return;
    resetRun();
    phase = "play";
    overlay.hidden = true;
    if (window.matchMedia("(max-width: 800px)").matches || "ontouchstart" in window) pads.classList.add("on");
  }

  function size() {
    const parent = canvas.parentElement;
    const cssW = parent.clientWidth || 390;
    const cssH = parent.clientHeight || 640;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  new ResizeObserver(size).observe(canvas.parentElement);

  function blocked(nx, ny, w, h) {
    const pts = [[nx + 4, ny + 8], [nx + w - 4, ny + 8], [nx + 4, ny + h - 2], [nx + w - 4, ny + h - 2]];
    return pts.some(([px, py]) => {
      const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
      if (ty < 0 || tx < 0 || ty >= ROWS || tx >= COLS) return true;
      const t = room.map[ty][tx];
      return t === 1 || t === 2;
    });
  }
  function doorSide() {
    const cx = player.x + player.w / 2, cy = player.y + player.h / 2;
    const tx = Math.floor(cx / TILE), ty = Math.floor(cy / TILE);
    if (ty < 0 || tx < 0 || ty >= ROWS || tx >= COLS) return null;
    if (room.map[ty][tx] !== 3 && room.map[ty][tx] !== 4) return null;
    if (tx <= 0) return "left";
    if (tx >= COLS - 1) return "right";
    if (ty <= 0) return "up";
    if (ty >= ROWS - 1) return "down";
    return null;
  }
  function unlockDoors(a, b, dir) {
    const flip = { left: "right", right: "left", up: "down", down: "up" };
    if (a.locked) a.locked[dir] = false;
    if (b.locked) b.locked[flip[dir]] = false;
    [a.map, b.map].forEach((m) => {
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (m[y][x] === 4) m[y][x] = 3;
    });
  }
  function enter(dir) {
    const next = room.links[dir];
    if (!next) return;
    const dest = rooms[next];
    const back = { left: "right", right: "left", up: "down", down: "up" }[dir];
    if ((room.locked && room.locked[dir]) || (dest.locked && dest.locked[back])) {
      if (invKeys <= 0) {
        note("Locked. Need a Pit Key.");
        if (dir === "right") player.x -= 8;
        if (dir === "left") player.x += 8;
        if (dir === "down") player.y -= 8;
        if (dir === "up") player.y += 8;
        return;
      }
      invKeys -= 1;
      unlockDoors(room, dest, dir);
      note("The gate takes the key.");
      hud();
    }
    if (next === "sanctum" && rooms.boss.jeets.some((j) => j.kind === "boss")) {
      note("The Jeet King still stands.");
      player.y += 8;
      return;
    }
    roomId = next;
    room = rooms[roomId];
    visited.add(roomId);
    if (dir === "right") player.x = TILE + 4;
    if (dir === "left") player.x = (COLS - 2) * TILE - player.w;
    if (dir === "down") player.y = TILE + 4;
    if (dir === "up") player.y = (ROWS - 2) * TILE - player.h;
  }
  function burst(x, y, c) {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      sparks.push({ x, y, vx: Math.cos(a) * 2.4, vy: Math.sin(a) * 2.4, life: 18, c });
    }
  }
  function vecFromFacing() {
    if (Math.abs(aimX) + Math.abs(aimY) > 0.2) {
      const l = Math.hypot(aimX, aimY) || 1;
      return { x: aimX / l, y: aimY / l };
    }
    if (player.facing === "left") return { x: -1, y: 0 };
    if (player.facing === "up") return { x: 0, y: -1 };
    if (player.facing === "down") return { x: 0, y: 1 };
    return { x: 1, y: 0 };
  }
  function poke() {
    if (phase !== "play" || pokeT > 0) return;
    pokeT = 18;
  }
  function shoot() {
    if (phase !== "play" || shootT > 0) return;
    if (!invFire) { note("Hellfire is still sealed."); return; }
    shootT = 26;
    const d = vecFromFacing();
    shots.push({ x: player.x + player.w / 2, y: player.y + 12, vx: d.x * 7, vy: d.y * 7, life: 36 });
  }
  function hitPlayer() {
    if (invuln > 0) return;
    lives -= 1;
    invuln = 48;
    player.hurt = 14;
    shake = 10;
    hitstop = 4;
    held = Math.floor(held * (modId === "calm" ? 0.75 : 0.5));
    hud();
    if (lives <= 0) {
      phase = "dead";
      showOverlay();
    }
  }

  function step(dt) {
    if (phase !== "play") return;
    if (hitstop > 0) { hitstop--; return; }
    frame++;
    if (pokeT) pokeT--;
    if (shootT) shootT--;
    if (invuln) invuln--;
    if (player.hurt) player.hurt--;
    if (shake) shake--;
    if (toastT) toastT--;

    let mx = 0, my = 0;
    if (keys.has("KeyA") || keys.has("ArrowLeft")) mx -= 1;
    if (keys.has("KeyD") || keys.has("ArrowRight")) mx += 1;
    if (keys.has("KeyW") || keys.has("ArrowUp")) my -= 1;
    if (keys.has("KeyS") || keys.has("ArrowDown")) my += 1;
    mx += stick.x; my += stick.y;
    let desired = null;
    if (Math.abs(mx) >= 0.2 || Math.abs(my) >= 0.2) {
      if (Math.abs(mx) >= 0.2 && Math.abs(my) >= 0.2) {
        if (lastCardinal === "left" || lastCardinal === "right") desired = mx < 0 ? "left" : "right";
        else desired = my < 0 ? "up" : "down";
      } else if (Math.abs(mx) >= Math.abs(my)) desired = mx < 0 ? "left" : "right";
      else desired = my < 0 ? "up" : "down";
    }
    if (dustCool) dustCool--;
    player.vx = 0; player.vy = 0;
    if (desired) {
      if (desired !== lastFacing) walkAcc = 0;
      lastCardinal = desired;
      lastFacing = desired;
      player.facing = desired;
      const dx = desired === "left" ? -1 : desired === "right" ? 1 : 0;
      const dy = desired === "up" ? -1 : desired === "down" ? 1 : 0;
      const prevX = player.x, prevY = player.y;
      const nx = player.x + dx * STEP_PX, ny = player.y + dy * STEP_PX;
      if (!blocked(nx, player.y, player.w, player.h)) player.x = nx;
      if (!blocked(player.x, ny, player.w, player.h)) player.y = ny;
      const moved = Math.abs(player.x - prevX) + Math.abs(player.y - prevY);
      if (moved > 0) {
        walkAcc += moved;
        player.vx = dx * STEP_PX; player.vy = dy * STEP_PX;
        if ((Math.floor(walkAcc / 16) % 2) === 1 && dustCool <= 0) {
          sparks.push({ x: player.x + player.w / 2 + (Math.random() * 6 - 3), y: player.y + player.h - 2, vx: -dx * 0.4, vy: 0.4, life: 10, c: "#6b4a32" });
          dustCool = 9;
        }
      }
      aimX = dx; aimY = dy;
    } else {
      walkAcc = 0;
    }
    const side = doorSide();
    if (side) enter(side);

    if (pokeT > 8) {
      const d = vecFromFacing();
      const box = { x: player.x + player.w / 2 + d.x * 22 - 14, y: player.y + 10 + d.y * 18, w: 28, h: 24 };
      room.jeets = room.jeets.filter((j) => {
        if (!aabb(box, j) || j.hurt > 0) return true;
        j.hp -= 1; j.hurt = 10;
        burst(j.x + 16, j.y + 16, "#ff5a00");
        shake = 6; hitstop = 2;
        const kb = vecFromFacing();
        j.x += kb.x * 10; j.y += kb.y * 10;
        if (j.hp > 0) return true;
        held += Math.round((j.kind === "boss" ? 200 : 40) * valueMul);
        if (j.kind === "boss") {
          room.coins.push(loot("heart", 6, 5), loot("chest", 7, 6, 250));
          note("The Jeet King falls. North is open.");
        }
        hud();
        return false;
      });
    }

    shots.forEach((s) => { s.x += s.vx; s.y += s.vy; s.life--; });
    shots = shots.filter((s) => {
      if (s.life <= 0) return false;
      const box = { x: s.x - 8, y: s.y - 8, w: 16, h: 16 };
      let hit = false;
      room.jeets = room.jeets.filter((j) => {
        if (!aabb(box, j) || j.hurt > 0) return true;
        j.hp -= 1; j.hurt = 10; hit = true;
        burst(j.x + 16, j.y + 16, "#ff7a18");
        if (j.hp > 0) return true;
        held += Math.round((j.kind === "boss" ? 200 : 40) * valueMul);
        if (j.kind === "boss") {
          room.coins.push(loot("heart", 6, 5), loot("chest", 7, 6, 250));
          note("The Jeet King falls. North is open.");
        }
        hud();
        return false;
      });
      return !hit;
    });

    room.jeets.forEach((j) => { if (j.hurt) j.hurt--; });
    const heat = 1 + (held / 700) * heatMul;
    room.jeets.forEach((j, i) => {
      const dx = player.x - j.x, dy = player.y - j.y, l = Math.hypot(dx, dy) || 1;
      let sx = 0, sy = 0;
      room.jeets.forEach((o, k) => {
        if (k === i) return;
        const ox = j.x - o.x, oy = j.y - o.y, d = Math.hypot(ox, oy) || 1;
        if (d < 48) { sx += ox / d; sy += oy / d; }
      });
      const spdJ = (j.kind === "boss" ? 38 : 62) * heat * dt;
      j.vx = (dx / l) * spdJ + sx * 0.4;
      j.vy = (dy / l) * spdJ + sy * 0.4;
      const jx = j.x + j.vx, jy = j.y + j.vy;
      if (!blocked(jx, j.y, j.w, j.h)) j.x = jx;
      if (!blocked(j.x, jy, j.w, j.h)) j.y = jy;
      j.facing = dx < 0 ? "left" : "right";
      if (aabb(player, j)) hitPlayer();
    });

    room.coins = room.coins.filter((c) => {
      const box = { x: c.x, y: c.y, w: 28, h: 26 };
      if (!aabb(player, box)) return true;
      if (c.kind === "key") { invKeys += 1; note("Pit Key"); burst(c.x, c.y, "#e8c36a"); hud(); return false; }
      if (c.kind === "hellfire") { invFire = true; note("Hellfire Orb — K to throw"); burst(c.x, c.y, "#ff5a00"); hud(); return false; }
      if (c.kind === "map") { invMap = true; note("Map of the Pit"); burst(c.x, c.y, "#d4c4a8"); hud(); return false; }
      if (c.kind === "heart") { lives = Math.min(6, lives + 1); note("Heart"); burst(c.x, c.y, "#e11d2e"); hud(); return false; }
      held += Math.round((c.v || 40) * valueMul);
      burst(c.x, c.y, "#5cbf6a");
      if (c.kind === "chest" && lives < 6) lives += 1;
      hud();
      return false;
    });

    if (room.altar) {
      const altarBox = { x: 9 * TILE, y: 4 * TILE, w: 40, h: 48 };
      if (aabb(player, altarBox) && held > 0) {
        lastBurn = held;
        ash += held;
        try { localStorage.setItem(ASH_KEY, String(ash)); } catch (e) {}
        held = 0;
        hud();
        phase = "burned";
        burst(altarBox.x + 20, altarBox.y, "#ff5a00");
        showOverlay();
      }
    }

    sparks.forEach((s) => { s.x += s.vx; s.y += s.vy; s.life--; });
    sparks = sparks.filter((s) => s.life > 0);
  }

  function ready(img) {
    return img.complete && img.naturalWidth > 8;
  }
  function sheetFrame(img, cols, rows, i, dx, dy, dw, dh, flip) {
    if (!ready(img)) return false;
    const cw = Math.floor(img.naturalWidth / cols);
    const ch = Math.floor(img.naturalHeight / rows);
    const col = i % cols;
    const row = Math.floor(i / cols);
    const pad = 2;
    const prevSmooth = ctx.imageSmoothingEnabled;
    ctx.imageSmoothingEnabled = false;
    ctx.save();
    if (flip) {
      ctx.translate(dx + dw, dy);
      ctx.scale(-1, 1);
      ctx.drawImage(img, col * cw + pad, row * ch + pad, cw - pad * 2, ch - pad * 2, 0, 0, dw, dh);
    } else {
      ctx.drawImage(img, col * cw + pad, row * ch + pad, cw - pad * 2, ch - pad * 2, dx, dy, dw, dh);
    }
    ctx.restore();
    ctx.imageSmoothingEnabled = prevSmooth;
    return true;
  }
  function draw() {
    const wrap = canvas.parentElement;
    const cssW = wrap.clientWidth || 390;
    const cssH = wrap.clientHeight || 640;
    const scale = Math.min(cssW / WORLD_W, cssH / WORLD_H);
    const ox = (cssW - WORLD_W * scale) / 2 + (shake ? (Math.random() - 0.5) * shake : 0);
    const oy = (cssH - WORLD_H * scale) / 2 + (shake ? (Math.random() - 0.5) * shake : 0);
    ctx.fillStyle = "#070504";
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.imageSmoothingEnabled = true;
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const t = room.map[y][x], dx = x * TILE, dy = y * TILE;
        if (t === 1) {
          if (ready(sheets.wall)) ctx.drawImage(sheets.wall, dx, dy, TILE, TILE);
          else {
            ctx.fillStyle = "#4a1510";
            ctx.fillRect(dx, dy, TILE, TILE);
          }
        } else if (t === 2) {
          ctx.fillStyle = "#0a0608";
          ctx.fillRect(dx, dy, TILE, TILE);
          ctx.fillStyle = "#6b21a8";
          ctx.beginPath(); ctx.ellipse(dx + 24, dy + 28, 14, 10, 0, 0, 7); ctx.fill();
        } else {
          if (ready(sheets.floor)) ctx.drawImage(sheets.floor, dx, dy, TILE, TILE);
          else {
            ctx.fillStyle = (x + y) % 2 ? "#2a1814" : "#231410";
            ctx.fillRect(dx, dy, TILE, TILE);
          }
          if (t === 3) {
            ctx.fillStyle = "rgba(255,90,0,0.28)";
            ctx.fillRect(dx, dy, TILE, TILE);
          }
          if (t === 4) {
            ctx.fillStyle = "rgba(90,70,20,0.85)";
            ctx.fillRect(dx, dy, TILE, TILE);
            sheetFrame(sheets.key, 2, 2, Math.floor(frame / 12) % 4, dx + 8, dy + 8, 32, 32);
          }
        }
      }
    }

    if (room.altar) {
      if (ready(sheets.altar)) ctx.drawImage(sheets.altar, 8.6 * TILE, 3.4 * TILE, 56, 64);
      else {
        ctx.fillStyle = "#3f3f46";
        ctx.fillRect(9 * TILE, 4 * TILE, 40, 48);
        ctx.fillStyle = "#ff7a18";
        ctx.fillRect(9 * TILE + 12, 4 * TILE - 10, 16, 12);
      }
    }

    room.coins.forEach((c) => {
      const fi = Math.floor(frame / 10) % 4;
      if (c.kind === "key") sheetFrame(sheets.key, 2, 2, fi, c.x, c.y, 32, 32);
      else if (c.kind === "heart") sheetFrame(sheets.heart, 2, 2, fi, c.x, c.y, 28, 28);
      else if (c.kind === "hellfire") sheetFrame(sheets.hellfire, 2, 2, fi, c.x, c.y, 32, 32);
      else if (c.kind === "map") sheetFrame(sheets.map, 2, 2, fi, c.x, c.y, 34, 34);
      else {
        const img = c.kind === "chest" ? sheets.chest : sheets.coin;
        if (ready(img)) ctx.drawImage(img, c.x, c.y, c.kind === "chest" ? 40 : 24, c.kind === "chest" ? 32 : 22);
      }
    });

    room.jeets.forEach((j) => {
      const img = j.kind === "blue" ? sheets.jeetB : sheets.jeetS;
      const fi = Math.floor(frame / 8) % 4;
      const dw = j.kind === "boss" ? 64 : 40, dh = j.kind === "boss" ? 70 : 44;
      if (j.hurt) ctx.filter = "brightness(2)";
      sheetFrame(img, 2, 2, fi, j.x, j.y, dw, dh, j.facing === "left");
      ctx.filter = "none";
      if (j.kind === "boss") {
        ctx.fillStyle = "#1a0a08";
        ctx.fillRect(j.x, j.y - 8, dw, 4);
        ctx.fillStyle = "#e11d2e";
        ctx.fillRect(j.x, j.y - 8, (dw * j.hp) / j.maxHp, 4);
      }
    });

    shots.forEach((s) => {
      const fi = Math.floor(frame / 4) % 4;
      if (!sheetFrame(sheets.fire, 2, 2, fi, s.x - 12, s.y - 12, 24, 24)) {
        ctx.fillStyle = "#ff7a18";
        ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, 7); ctx.fill();
      }
    });

    const moving = Math.hypot(player.vx, player.vy) > 0.4;
    const dirRow = player.facing === "down" ? 0 : player.facing === "left" ? 1 : player.facing === "right" ? 2 : 3;
    let img = sheets.walk, cols = 4, rows = 4, fi = dirRow * 4, bob = 0;
    if (pokeT > 0) {
      img = sheets.attack;
      const step = pokeT > 14 ? 0 : pokeT > 10 ? 1 : pokeT > 5 ? 2 : 3;
      fi = dirRow * 4 + step;
    } else if (shootT > 0) {
      img = sheets.shoot;
      const step = shootT > 20 ? 0 : shootT > 14 ? 1 : shootT > 8 ? 2 : 3;
      fi = dirRow * 4 + step;
    } else if (moving) {
      const cycle = [0, 1, 2, 3, 2, 1];
      const step = cycle[Math.floor(walkAcc / 10) % 6];
      fi = dirRow * 4 + step;
      bob = step % 2 === 1 ? -2 : 0;
    }
    if (invuln % 6 < 3 || invuln === 0) {
      sheetFrame(img, cols, rows, fi, Math.round(player.x) - 14, Math.round(player.y) - 22 + bob, 64, 70, false);
    }

    sparks.forEach((s) => {
      ctx.globalAlpha = s.life / 18;
      ctx.fillStyle = s.c;
      ctx.fillRect(s.x, s.y, 3, 3);
      ctx.globalAlpha = 1;
    });
    ctx.fillStyle = "#f3ece4";
    ctx.font = "10px ui-monospace, monospace";
    ctx.fillText(room.altar ? "WALK THE ALTAR TO ASH THE BAG" : room.name.toUpperCase(), 16, WORLD_H - 10);
    if (toastT > 0) {
      ctx.fillStyle = "rgba(7,5,4,0.72)";
      ctx.fillRect(WORLD_W / 2 - 130, 16, 260, 22);
      ctx.fillStyle = "#ffb020";
      ctx.textAlign = "center";
      ctx.fillText(toastMsg.toUpperCase(), WORLD_W / 2, 31);
      ctx.textAlign = "left";
    }
    if (invMap) {
      const mx0 = WORLD_W - 78, my0 = 10;
      ctx.fillStyle = "rgba(7,5,4,0.7)";
      ctx.fillRect(mx0 - 4, my0 - 4, 70, 70);
      Object.keys(rooms).forEach((id) => {
        const r = rooms[id];
        if (!visited.has(r.id) && r.id !== roomId) return;
        ctx.fillStyle = r.id === roomId ? "#ff5a00" : "#6b3a28";
        ctx.fillRect(mx0 + r.gx * 16, my0 + (3 - r.gy) * 16, 14, 14);
      });
    }
    ctx.restore();
  }

  function loop(now) {
    if (!running) return;
    const raw = Math.min(0.1, (now - last) / 1000);
    last = now;
    acc += raw;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
    draw();
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  function onKey(e, down) {
    if (MOVE.has(e.code)) e.preventDefault();
    if (e.repeat && (e.code === "KeyJ" || e.code === "KeyK" || e.code === "Space" || e.code === "Enter")) return;
    if (down) {
      keys.add(e.code);
      if (e.code === "KeyA" || e.code === "ArrowLeft") lastCardinal = "left";
      if (e.code === "KeyD" || e.code === "ArrowRight") lastCardinal = "right";
      if (e.code === "KeyW" || e.code === "ArrowUp") lastCardinal = "up";
      if (e.code === "KeyS" || e.code === "ArrowDown") lastCardinal = "down";
    } else keys.delete(e.code);
    if (down && (e.code === "KeyJ" || e.code === "Space")) poke();
    if (down && (e.code === "KeyK" || e.code === "KeyF")) shoot();
    if (down && e.code === "Enter" && phase !== "play") startPlay();
    if (down && phase !== "play" && (e.code === "KeyW" || e.code === "KeyA" || e.code === "KeyS" || e.code === "KeyD")) startPlay();
  }
  window.addEventListener("keydown", (e) => onKey(e, true));
  window.addEventListener("keyup", (e) => onKey(e, false));
  window.addEventListener("blur", () => keys.clear());

  function setStick(clientX, clientY) {
    const r = stickEl.getBoundingClientRect();
    let x = ((clientX - r.left) / r.width) * 2 - 1;
    let y = ((clientY - r.top) / r.height) * 2 - 1;
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    if (m < 0.18) { stick.x = 0; stick.y = 0; knob.style.transform = "translate(-50%,-50%)"; return; }
    stick.x = x; stick.y = y;
    knob.style.transform = "translate(calc(-50% + " + (x * 28) + "px), calc(-50% + " + (y * 28) + "px))";
  }
  stickEl.addEventListener("pointerdown", (e) => {
    pointerId = e.pointerId;
    stickEl.setPointerCapture(e.pointerId);
    setStick(e.clientX, e.clientY);
  });
  stickEl.addEventListener("pointermove", (e) => {
    if (pointerId !== e.pointerId) return;
    setStick(e.clientX, e.clientY);
  });
  function stickUp(e) {
    if (pointerId !== e.pointerId) return;
    pointerId = null; stick.x = 0; stick.y = 0;
    knob.style.transform = "translate(-50%,-50%)";
  }
  stickEl.addEventListener("pointerup", stickUp);
  stickEl.addEventListener("pointercancel", stickUp);
  document.getElementById("poke").addEventListener("pointerdown", (e) => { e.preventDefault(); poke(); });
  document.getElementById("fire").addEventListener("pointerdown", (e) => { e.preventDefault(); shoot(); });
  document.getElementById("start").addEventListener("click", startPlay);
})();
</script>
</body>
