<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>$EPEPE</title>
<meta property="og:image" content="https://i.imgur.com/sMtcXs4.jpeg"/>
<link rel="icon" href="https://i.imgur.com/sMtcXs4.jpeg"/>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #050303;
    color: #f3ece4;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
  img.frog { width: min(280px, 70vw); border-radius: 18px; }
  h1 { font-size: clamp(48px, 14vw, 84px); margin: 12px 0 0; letter-spacing: 1px; }
  h1 b { color: #ff3b1a; }
  .tag { color: #ffb020; font-weight: 800; letter-spacing: .18em; font-size: 12px; }
  p { color: #cbb7ab; line-height: 1.5; }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0; }
  a.btn, button.btn {
    background: #ff3b1a; color: #fff; border: 0; border-radius: 999px;
    padding: 12px 18px; font-weight: 800; text-decoration: none; cursor: pointer;
  }
  a.ghost, button.ghost { background: #1a0c0a; border: 1px solid #6a2a1c; }
  .ca { background: #140808; border: 1px dashed #4a2218; border-radius: 12px; padding: 12px; word-break: break-all; font-size: 13px; }
  .play {
    margin-top: 28px; background: #120707; border: 1px solid #4a1c14;
    border-radius: 16px; padding: 18px;
  }
  .score { font-size: 28px; font-weight: 800; margin: 8px 0 14px; }
  #fire {
    width: 100%; max-width: 360px; min-height: 72px; font-size: 22px;
    background: linear-gradient(#ff5a22, #b50d00);
  }
  footer { margin-top: 28px; color: #7d635a; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">BONDED · PULSECHAIN</div>
    <img class="frog" src="https://i.imgur.com/sMtcXs4.jpeg" alt="Evil Pepe"/>

    var CA = "0xf646e3d650795ec693960f874b906a1b8db91c76";
    var score = 0;
    document.getElementById("copy").onclick = function () {
      if (navigator.clipboard) navigator.clipboard.writeText(CA);
      this.textContent = "Copied";
    };
    document.getElementById("fire").onclick = function () {
      score += 697;
      document.getElementById("score").textContent = score;

    document.getElementById("share").onclick = function () {
      var text = "$EPEPE burned " + score + " bags · x.com/evilpepelol · evilpepe.lol";
