<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>$EPEPE</title>
<link rel="icon" href="https://i.imgur.com/sMtcXs4.jpeg"/>
<meta property="og:image" content="https://i.imgur.com/sMtcXs4.jpeg"/>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #050303; color: #f4ece6; font-family: Arial, Helvetica, sans-serif; }
  .top { padding: 16px 14px 8px; text-align: center; }
  .frog-icon { width: 72px; height: 72px; border-radius: 16px; object-fit: cover; }
  h1 { margin: 8px 0 10px; font-size: 42px; letter-spacing: 1px; }
  h1 b { color: #ff3418; }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  a, button {
    appearance: none; border: 0; background: #1b0c0a; color: #fff;
    border: 1px solid #6a2418; border-radius: 999px; padding: 10px 14px;
    font-weight: 800; text-decoration: none; cursor: pointer;
  }
  a.buy { background: #ff3418; border-color: #ff3418; }
  .ca { margin: 10px 14px 0; text-align: center; color: #9a7d72; font-size: 11px; word-break: break-all; }
  .hud { display: flex; justify-content: space-between; padding: 8px 14px; font-weight: 800; }
  canvas { width: 100%; height: auto; display: block; background: #0a0404; touch-action: none; }
  .hint { text-align: center; color: #b89a90; font-size: 13px; padding: 8px 14px 24px; }
</style>
</head>
<body>
  <div class="top">
    <img class="frog-icon" src="https://i.imgur.com/sMtcXs4.jpeg" alt="$EPEPE"/>
    <h1>$EPE<b>PE</b></h1>
    <div class="btns">
      <a class="buy" href="https://pulsex.exchange/#/swap?outputCurrency=0xf646e3d650795ec693960f874b906a1b8db91c76" target="_blank" rel="noreferrer">Buy</a>
      <a href="https://dexscreener.com/pulsechain/0x5627b7ea910e292b565f7f31824bc9018c1a804d" target="_blank" rel="noreferrer">Chart</a>
      <a href="https://x.com/evilpepelol" target="_blank" rel="noreferrer">X</a>
      <a href="https://t.me/evilpepelol" target="_blank" rel="noreferrer">Telegram</a>
      <button id="copy" type="button">Copy CA</button>
    </div>
    <div class="ca">0xf646e3d650795ec693960f874b906a1b8db91c76</div>
  </div>
  <div class="hud"><span>BURNED <span id="score">0</span></span><span>BEST <span id="best">0</span></span></div>
  <canvas id="game" width="390" height="560"></canvas>
  <p class="hint">Drag the frog. Line him up with the bags. Fire shoots by itself.</p>
<script>
var CA = "0xf646e3d650795ec693960f874b906a1b8db91c76";
document.getElementById("copy").onclick = function () {
  if (navigator.clipboard) navigator.clipboard.writeText(CA);
  this.textContent = "Copied";
};

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var frogImg = new Image();
frogImg.src = "https://i.imgur.com/sMtcXs4.jpeg";
var W = 390, H = 560;
var frog = { x: 70, y: 280 };
var bags = [];
var score = 0;
var best = Number(localStorage.getItem("epepeBest") || 0);
var dragging = false;
var tick = 0;
document.getElementById("best").textContent = best;

function size() {
  var w = Math.min(window.innerWidth, 720);
  var h = Math.max(420, Math.floor(window.innerHeight * 0.62));
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.floor(w * 2);
  canvas.height = Math.floor(h * 2);
  W = canvas.width;
  H = canvas.height;
  frog.x = Math.min(frog.x, W * 0.28);
}
size();
window.addEventListener("resize", size);

function pos(e) {
  var t = e.touches ? e.touches[0] : e;
  var r = canvas.getBoundingClientRect();
  return {
    x: (t.clientX - r.left) * (canvas.width / r.width),
    y: (t.clientY - r.top) * (canvas.height / r.height)
  };
}
function moveFrog(p) {
  frog.x = Math.max(W * 0.12, Math.min(W * 0.42, p.x));
  frog.y = Math.max(H * 0.12, Math.min(H * 0.88, p.y));
}
canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); dragging = true; moveFrog(pos(e)); canvas.setPointerCapture(e.pointerId); }, { passive: false });
canvas.addEventListener("pointermove", function (e) { if (!dragging) return; e.preventDefault(); moveFrog(pos(e)); }, { passive: false });
canvas.addEventListener("pointerup", function () { dragging = false; });
canvas.addEventListener("pointercancel", function () { dragging = false; });

function spawn() {
  bags.push({
    x: W + 40,
    y: H * (0.15 + Math.random() * 0.7),
    v: (W / 180) + Math.random() * (W / 220),
    r: W * 0.045
  });
}

function loop() {
  tick++;
  ctx.fillStyle = "#0a0404";
  ctx.fillRect(0, 0, W, H);
  if (tick % 38 === 0) spawn();

  var fireW = W * 0.55;
  var fireH = H * 0.07;
  var g = ctx.createLinearGradient(frog.x, frog.y, frog.x + fireW, frog.y);
  g.addColorStop(0, "rgba(255,230,80,.95)");
  g.addColorStop(0.35, "rgba(255,70,10,.85)");
  g.addColorStop(1, "rgba(255,30,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(frog.x + fireW * 0.55, frog.y, fireW * 0.55, fireH, 0, 0, Math.PI * 2);
  ctx.fill();

  bags.forEach(function (b) {
    b.x -= b.v;
    ctx.fillStyle = "#8a5520";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#111"; ctx.font = Math.floor(b.r) + "px Arial";
    ctx.fillText("$", b.x - b.r * 0.35, b.y + b.r * 0.35);
  });

  bags = bags.filter(function (b) {
    var inFire = b.x > frog.x && b.x < frog.x + fireW && Math.abs(b.y - frog.y) < fireH + b.r;
    if (inFire) {
      score += 697;
      document.getElementById("score").textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem("epepeBest", String(best));
        document.getElementById("best").textContent = best;
      }
      return false;
    }
    return b.x > -40;
  });

  var size = W * 0.22;
  if (frogImg.complete) ctx.drawImage(frogImg, frog.x - size * 0.55, frog.y - size * 0.55, size, size);
  else {
    ctx.fillStyle = "#2f8a3a";
    ctx.beginPath(); ctx.arc(frog.x, frog.y, size * 0.35, 0, Math.PI * 2); ctx.fill();
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
